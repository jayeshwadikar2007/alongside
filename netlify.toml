[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Rewrite /api/claude → /.netlify/functions/claude  (keeps frontend URLs unchanged)
[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

# Rewrite /api/agent → /.netlify/functions/agent
[[redirects]]
  from = "/api/agent"
  to = "/.netlify/functions/agent"
  status = 200

# SPA fallback — all other paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
